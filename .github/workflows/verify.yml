name: Verify contracts
on:
  push:
  pull_request:
jobs:
  direct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: genvm-lint check contracts/cross_chain_event_verifier.py
      - run: genvm-lint typecheck contracts/cross_chain_event_verifier.py
      - run: genvm-lint check contracts/examples/cross_chain_release_gate.py
      - run: genvm-lint typecheck contracts/examples/cross_chain_release_gate.py
      - run: pytest tests/direct -q
